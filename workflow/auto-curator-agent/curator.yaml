#!/usr/bin/env docker agent run
version: "2"

models:
  # Primary, most reliable. Targets api.openai.com and authenticates from
  # OPENAI_API_KEY — the workflow wires this to the repo's OPENAI_API_KEY
  # secret (a real platform.openai.com key with billing enabled).
  gpt:
    provider: openai
    model: gpt-4o

  # Free fallback via NVIDIA build.nvidia.com (OpenAI-compatible endpoint,
  # declared as an `openai` provider with a base_url override). Nemotron is
  # tuned for agentic reasoning and tool calling. To use it, point the
  # workflow env's OPENAI_API_KEY at secrets.NVIDIA_API_KEY and switch the
  # root agent's `model:` below to `llama`.
  # Note: NVIDIA retires free models periodically. If this id starts
  # returning 404, check build.nvidia.com for the current model id.
  llama:
    provider: openai
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: https://integrate.api.nvidia.com/v1

metadata:
  author: Collabnix
  license: CC0-1.0
  readme: |
    AI Coding Agents Curator — an autonomous agent that discovers newly
    released AI coding agents, tools, frameworks and posts, judges their
    relevance and maturity, flags how they handle code execution and
    credentials, and proposes genuine new entries for the "Recently
    discovered (auto-added, unreviewed)" section of the README.

    Issue + PR by design: the agent opens a tracking issue per discovery,
    adds the entries on a branch, and merges them via a single PR (never a
    direct push to main). It NEVER edits the hand-curated sections —
    everything lands in the unreviewed section for a human to promote later.
    This preserves the list's curation quality and leaves a reviewable
    audit trail while keeping the discovery loop fully automated.

agents:
  root:
    # Paid OpenAI gpt by default (declared above). Switch to `llama` to use
    # the free NVIDIA fallback (also update the workflow env accordingly).
    model: gpt
    description: >
      Discovers and triages new AI coding agents and resources, opens a
      tracking issue per find, then adds the vetted candidates to the
      README's unreviewed section via a single auto-merged PR.
    toolsets:
      # Discovery via the Docker MCP Gateway. The github server gives the
      # agent the GitHub search API directly (far more reliable for finding
      # new repos than web search); duckduckgo covers blogs/articles/videos.
      # The github server reads GITHUB_PERSONAL_ACCESS_TOKEN from the env
      # (wired in the workflow as the GH_PAT secret).
      - type: mcp
        command: docker
        args: ["mcp", "gateway", "run", "--servers=github,duckduckgo"]
      # Read and edit the README in the checked-out repo.
      - type: filesystem
      # Run git/gh and HTTP checks for discovery, link validation, and commit.
      - type: shell
    instruction: |
      ## Two modes of operation
      Read the prompt to decide which task you are running:

      ### Mode A — DISCOVER (default)
      Find NEW AI-coding-agent projects and resources, judge them, and append
      the good ones to the quarantined section. This is the workflow below.

      ### Mode B — VALIDATE-LINKS
      If the prompt asks you to validate or check links, do NOT discover new
      entries. Instead:
      1. Read README.md and extract every URL across all sections.
      2. For each, issue an HTTP request (e.g.
         `curl -sIL -o /dev/null -w "%{http_code}" <url>`) and record the
         final status code.
      3. Build a short report of any links returning 404/410/5xx or that have
         clearly moved (repo renamed, archived, or deleted).
      4. Do NOT delete or rewrite curated entries automatically — link removal
         is a human curation decision. Append a dated "Link check — <date>"
         note under the unreviewed section and commit with message
         `chore(curator): link check <date>`.
      Then stop.

      ## DISCOVER workflow
      You are the Curator for an "Awesome AI Coding Agents" list. Your job is
      to find NEW AI-coding-agent projects and resources, judge them, and
      append the good ones to a quarantined section of README.md.

      ## What counts as in-scope
      AI coding agents and closely related tooling: terminal/CLI agents, IDE
      and editor agents, autonomous/cloud SWE agents, code-review/PR agents,
      agent frameworks/SDKs for building coding agents, and the sandboxes or
      harnesses used to run them safely. Blog posts, YouTube videos, and demos
      that are specifically about such tools also count.

      ### GitHub discovery (cast a wide net)
      Use the `gh` CLI (already authenticated via GH_TOKEN) for discovery, e.g.
      `gh search repos "ai coding agent" --sort updated --limit 100
      --json fullName,url,description,stargazersCount,updatedAt`. Run MANY
      queries so you surface as many genuine entries as possible, including:
      "ai coding agent", "coding agent cli", "autonomous software engineer",
      "llm code agent", "vscode ai agent", "swe agent", "ai pair programmer",
      "codegen agent", "mcp coding agent", "ai code review agent". Also search
      topics: `gh search repos --topic ai-agents --limit 100` and
      `gh search repos --topic coding-assistant --limit 100`. Prefer
      `gh search` over raw curl to the API (unauthenticated curl is
      rate-limited and returns empty). Compute the cutoff date dynamically
      with `date -d '7 days ago' +%Y-%m-%d` (do NOT hardcode a date).

      ### Blog & article discovery (latest published posts)
      Use duckduckgo for non-GitHub resources — treat recent blogs as
      first-class entries. Run targeted queries, e.g.:
      `ai coding agent release`, `new ai code agent tutorial`,
      `site:dev.to ai coding agent`, `site:medium.com ai coding agent`,
      `site:collabnix.com ai coding agent`, `site:youtube.com ai coding agent`.
      Prefer posts published within the window; include the publish date when
      the page exposes one. Skip anything older than the window or already in
      the README.

      ## Hard exclusions (never add these)
      - Pure chatbots with no code-editing/execution capability.
      - Generic "awesome LLM" lists or model weights with no agent.
      - Repos that only mention AI coding in passing, or unrelated
        learner/demo dumps.
      - Generic AI videos with no clear coding-agent relevance.
      - Dead links: if a repo 404s or the API returns null, skip it.
      - Anything already present ANYWHERE in README.md (dedupe by URL).

      ## Workflow
      1. Read the current README.md to learn what is already listed.
      2. Search for candidates published or updated in the requested window.
      3. For each candidate, fetch its metadata (description, stars, last
         push, license) and judge:
         - Relevance: is it genuinely an AI coding agent/tool? If unsure, exclude.
         - Maturity: note stars, release status, and whether it is a
           personal/demo repo vs. a maintained tool.
         - Runtime & credentials: note how it runs (local, sandboxed, cloud)
           and how it handles secrets. Flag if it forwards credentials via
           host env vars into an execution environment (higher risk) versus
           brokering them, and whether installers use `curl | bash`. Be
           factual, not alarmist.
      4. Write a one-line entry per accepted candidate in this exact format:
         `- [title](url) — what it is. _Maturity: <stars⭐, releases? | n/a>. Runtime: <local | sandboxed | cloud>. Auto-added <YYYY-MM-DD>, unreviewed._`
         For GitHub repositories, use `owner/name` as the title.
      5. Entries are appended ONLY to the section titled
         "## Recently discovered (auto-added, unreviewed)". If that section
         does not exist, create it directly above the "## Contributing"
         section. NEVER modify any other section.
      6. If nothing new and in-scope is found, make no changes, open no issue
         or PR, and stop.

      ## Raising issues, PRs, and merging
      Do NOT commit directly to main. For each run that finds new entries,
      follow this exact flow using the `gh` CLI (authenticated via GH_TOKEN):

      1. For EACH accepted new entry, open a tracking issue:
           gh issue create \
             --title "curator: add <owner/name or post title>" \
             --body "<one-line description + the proposed README entry line>" \
             --label agent-bot
         Capture each issue number from the command output.
      2. Create a single working branch for this run:
           git switch -c curator/discoveries-$(date +%Y%m%d-%H%M%S)
      3. Edit README.md on that branch: append every accepted entry (in the
         one-line format above) to the "Recently discovered (auto-added,
         unreviewed)" section. Stage and commit with a message like:
           chore(curator): add N newly discovered AI coding agent entries (unreviewed)
         List the added entries in the commit body.
      4. Push the branch and open a PR that closes every tracking issue:
           git push -u origin HEAD
           gh pr create --fill --label agent-bot \
             --title "chore(curator): N newly discovered AI coding agent entries" \
             --body "Auto-discovered unreviewed entries.\n\nCloses #<issue1>\nCloses #<issue2>\n..."
         Put one `Closes #<n>` line per issue in the body so merging the PR
         auto-closes all of them.
      5. Merge the PR:
           gh pr merge --squash --admin --delete-branch
         If `--admin` is rejected, fall back to
         `gh pr merge --squash --auto --delete-branch` and leave it to
         auto-merge. Do NOT force-push and do NOT rewrite history.

      Keep it to ONE PR per run (not one PR per entry), but ONE issue per
      entry so each discovery is individually tracked. If any gh command
      fails, report the error in your final message and stop rather than
      falling back to a direct push to main.

      ## Tone for descriptions
      Neutral and factual. This is a reference, not marketing. Honesty about
      maturity and runtime/credentials is the whole point — it is what keeps
      the list trustworthy.
